## HTTP runbook — httpbin.org basic requests
#
# Calls two endpoints on the public httpbin.org test service to demonstrate
# multi-step HTTP runbooks.
#
# Prerequisites:
#   Before running this sample you must have the two API definitions below
#   saved in MCP Explorer.  Add them once via the UI (HTTP APIs → New) or
#   using the CLI import command (see README.md).
#
#   Name                 Method  URL
#   ─────────────────── ──────  ──────────────────────────────────────────
#   HttpBin Get          GET     https://httpbin.org/get
#   HttpBin Status       GET     https://httpbin.org/status/{code}
#
# Run:
#   mcp-http http runbook --file samples/http/httpbin-basic.yaml

version: "1"

schedule:
  repeat: 1

steps:
  # ── Step 1: basic GET ─────────────────────────────────────────────────────────
  # Calls https://httpbin.org/get and returns request metadata echoed by httpbin.
  - id: get-headers
    endpoint: HttpBin Get

  # ── Step 2: status-code probe ─────────────────────────────────────────────────
  # Requests a 200 response from the /status/{code} endpoint.
  - id: get-200-status
    endpoint: HttpBin Status
    inputs:
      code: "200"
